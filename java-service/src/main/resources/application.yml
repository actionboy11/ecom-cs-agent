server:
  port: 8080

spring:
  application:
    name: cs-agent-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:cs_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:csagent}
    password: ${MYSQL_PASSWORD:csagent}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    # 生产必须通过环境变量 JWT_SECRET 注入；留空则进程内生成一次性密钥（重启即失效）
    secret: ${JWT_SECRET:}
    ttl-seconds: 7200

logging:
  level:
    com.example.csagent: info
    org.flywaydb: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
