spring:
  flyway:
    clean-disabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/cs_agent_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:csagent}
    password: ${MYSQL_PASSWORD:csagent}

app:
  # 内部审计接口的测试令牌
  internal-audit-token: test-internal-token
  jwt:
    # 仅测试用固定密钥，保证同一轮测试内令牌可验证；生产走环境变量
    secret: test-only-secret-key-for-ci-32-bytes!
    ttl-seconds: 7200

# 测试库结构由 Flyway 迁移建立，数据在多次运行间保留（未做 clean）。
# 种子数据由 V2__seed.sql 以显式 id 写入，因此断言 userId 稳定。
