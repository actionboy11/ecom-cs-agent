name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python（lint + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（锁定版本）
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q

  java:
    name: Java（测试 + MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cs_agent_test
          MYSQL_USER: csagent
          MYSQL_PASSWORD: csagent
        ports:
          - "3308:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: java-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3308"
          MYSQL_USER: csagent
          MYSQL_PASSWORD: csagent
        run: mvn -B test

  compose:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 .env
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config -q
