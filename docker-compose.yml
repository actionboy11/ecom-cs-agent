services:
  mysql:
    image: mysql:8.4
    container_name: cs-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cs_agent
      MYSQL_USER: csagent
      MYSQL_PASSWORD: csagent
    ports:
      # 宿主机 3307 → 容器 3306：本机已装 MySQL 占用 3306，避免冲突
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  java-service:
    build: ./java-service
    container_name: cs-agent-java
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy

  python-agent:
    build: ./python-agent
    container_name: cs-agent-python
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BUSINESS_API_BASE: http://java-service:8080
    depends_on:
      - java-service
